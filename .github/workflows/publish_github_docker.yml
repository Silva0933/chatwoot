name: Publish Chatwoot docker images to GitHub

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  release:
    types: [released]
  workflow_dispatch:

# Every run's merge job writes the same :main and :latest tags, and the deploy
# pulls them. Two runs overlapping means a deploy can read a tag mid-write: that
# is how a push landed on a manifest that had amd64 but not yet arm64, on an
# arm64 host. Runs queue instead of racing; they are not cancelled, because
# cancelling one mid-deploy would leave the stack half-updated.
concurrency:
  group: publish-and-deploy
  cancel-in-progress: false

env:
  GITHUB_REPO: ghcr.io/silva0933/chatwoot

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GIT_REF: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Update version in app.yml
        run: |
          if [[ "$GIT_REF" =~ ^v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Updating version to: $VERSION"
            sed -i "s/version: '.*'/version: '$VERSION'/" config/app.yml
          else
            echo "No version tag found, keeping existing version"
          fi

      - name: Set Docker Tags
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          echo "SANITIZED_REF=${SANITIZED_REF}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        id: build-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
          tags: |
            ${{ env.GITHUB_REPO }}:${{ env.SANITIZED_REF }}
            ${{ env.GITHUB_REPO }}:latest

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-ghcr.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          GIT_REF: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          docker buildx imagetools create \
            -t ghcr.io/silva0933/chatwoot:${SANITIZED_REF} \
            -t ghcr.io/silva0933/chatwoot:latest \
            $(printf 'ghcr.io/silva0933/chatwoot@sha256:%s ' *)

      - name: Inspect image
        env:
          GIT_REF: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          REPO="ghcr.io/silva0933/chatwoot"
          docker buildx imagetools inspect ${REPO}:${SANITIZED_REF}
          docker buildx imagetools inspect ${REPO}:latest
  # Closes the loop: a push to main builds the image and rolls it out, so no one
  # has to click Run workflow and then deploy by hand.
  #
  # The rollout goes over SSH rather than through Coolify's API. Coolify's
  # `docker compose pull` dies on a containerd lease bug on this host, and it
  # removes the running containers before it gets there, so a deploy through it
  # reliably takes production down instead of updating it. Repairing containerd
  # would mean restarting the daemon, which would also restart the unrelated
  # production services that share the host. The key used here is pinned to a
  # single forced command on the server, so CI can run this deploy and nothing
  # else - not a shell, not another command.
  deploy:
    runs-on: ubuntu-latest
    needs:
      - merge
    steps:
      - name: Roll out and wait for the app to answer
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: 64.181.181.116
          SSH_USER: ubuntu
          SSH_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC/eSs8H/olLmzf6hPDTjJZcaQMzx9ulUUA2GfjsO6G4
          HEALTH_URL: https://chatwoot.secretariaai.eu.cc/api
        run: |
          set -euo pipefail

          if [ -z "${SSH_KEY}" ]; then
            echo "VPS_SSH_KEY secret is not set; the image was published but nothing was deployed." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned rather than accepted on first use: the runner is new every time,
          # so trust-on-first-use here would trust whatever answers on that address.
          printf '%s %s\n' "${SSH_HOST}" "${SSH_HOST_KEY}" > ~/.ssh/known_hosts

          echo "Deploying..."
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o BatchMode=yes -o ConnectTimeout=20 "${SSH_USER}@${SSH_HOST}"

          # The deploy script returns once compose has created the containers, which
          # is well before Rails is listening, so wait on the app's own readiness.
          for _ in $(seq 1 40); do
            body=$(curl -fsS --max-time 10 "${HEALTH_URL}" || true)
            case "${body}" in
              *'"queue_services":"ok"'*'"data_services":"ok"'*)
                echo "healthy: ${body}"
                exit 0
                ;;
            esac
            sleep 15
          done

          echo "App did not answer within 10 minutes; check the server." >&2
          exit 1
